# Configuration gitleaks : règles par défaut + allowlist de faux positifs vérifiés.
#
# La règle generic-api-key matche le motif « <variable> = "<valeur 16 car.>" »
# dans ventilate() de apps/api/services/beges_export.py : la valeur est un
# identifiant de poste de la nomenclature BEGES (clé de mapping), PAS un secret.
# On allowliste par contenu de ligne → indépendant du commit et du numéro de
# ligne (les fingerprints commit:fichier:règle:ligne dérivent à chaque édition).
[extend]
useDefault = true

[allowlist]
description = "Faux positifs verifies (identifiants de poste BEGES, pas des secrets)."
regexTarget = "line"
regexes = [
  '''S3\.uncategorized''',
  # Fixtures de DÉMONSTRATION 100% fictives : le champ JSON « "key": "<id>" »
  # (identifiant sémantique kebab-case, ex. water-reduction-2030) matche la règle
  # generic-api-key, mais n'est PAS un secret — donnée inventée (synthetic=true).
  '''"key": "[a-z][a-z0-9-]+"''',
  # Fixtures P03 (pipeline opérateur Water Intelligence, apps/api/tests/test_water_intelligence_pipeline.py) :
  # `release_key` est le nom réel du champ WaterSourceReference/run_pipeline (P02) —
  # renommer romprait ce contrat. La valeur "fixture-2026-01" est un placeholder de
  # test à faible entropie, jamais un secret ; matche generic-api-key uniquement à
  # cause du suffixe "_key". Même raisonnement que le cas BEGES ci-dessus.
  '''release_key="fixture-2026-01"''',
  # Connecteur Copernicus EDO (Wave A, apps/api/tests/test_water_intelligence_copernicus_edo.py) :
  # `EdoSnapshotConfig.release_key` compose déterministiquement
  # "copernicus-edo-cdi-{version}-{YYYYMM}d{décade}" (cf. copernicus_edo.py) — ce
  # n'est pas un secret, c'est une clé de release lisible et reproductible. Matche
  # generic-api-key pour la même raison que les deux cas ci-dessus (suffixe "_key"
  # + chaîne à tirets de longueur/entropie plausible).
  '''"copernicus-edo-cdi-v4\.1-202607d2"''',
  # Socle Hub'Eau (Wave B, apps/api/services/water_intelligence/hubeau_transport.py) :
  # `HubeauEndpoint.api_path` porte le SEGMENT DE ROUTE PUBLIC de l'API Hub'Eau
  # ("v2/hydrometrie", "v1/niveaux_nappes", "v1/prelevements",
  # "v2/qualite_rivieres"). Ce sont des chemins d'URL documentés publiquement,
  # jamais des secrets — Hub'Eau n'exige d'ailleurs aucune authentification.
  # Le nom de champ contient "api", mot-clé de la règle generic-api-key, et
  # "v2/hydrometrie" (3.52) comme "v2/qualite_rivieres" (3.54) dépassent de peu
  # le seuil d'entropie de 3.5 — d'où le faux positif. Motif volontairement
  # étroit : seules les valeurs de la forme `v<1|2>/<nom_de_service>` affectées à
  # `api_path` sont couvertes, rien d'autre.
  '''api_path"?\s*[:=]\s*"v[12]/[a-z_]+"''',
  # Tests Water Intelligence (Wave C, apps/api/tests/test_water_intelligence_*.py) :
  # `release_key` est le nom réel du champ `WaterSourceReference` (contrat P02) —
  # le renommer romprait ce contrat. Les valeurs sont des clés de release de
  # FIXTURE, lisibles et sans secret ("eea-wei-plus-2023-fixture",
  # "hubeau-hydro-2026-01", "aqueduct-4-0-fixture"…), qui matchent
  # generic-api-key uniquement à cause du suffixe "_key" et d'une entropie de
  # 3.6-3.9, juste au-dessus du seuil de 3.5. Les occurrences de HEAD passent
  # déjà par des constantes nommées ; cette entrée couvre les commits antérieurs
  # de la PR, que gitleaks scanne aussi et qu'un correctif en avant ne peut pas
  # nettoyer. Motif volontairement étroit : seules les clés de release des
  # fixtures Water Intelligence sont couvertes.
  '''release_key="(?:eea-wei-plus|hubeau-|aqueduct-|bnpe-)[A-Za-z0-9._-]*"''',
  # Rapports de validation live X1 (docs/carbonco/water-intelligence/activation/reports/*.md,
  # scripts/water_intelligence/reporting.py) : le JSON structuré embarqué dans
  # chaque rapport porte `"release_key": "<valeur>"` — même champ P02 que
  # ci-dessus, mais sous sa forme JSON (clé et valeur entre guillemets, deux-points)
  # plutôt que le kwarg Python `release_key="…"`. Les valeurs sont des identifiants
  # de recette choisis par l'opérateur pour CETTE validation
  # ("hubeau-piezometrie-chroniques-2026-07-26-recette-x1",
  # "hubeau-bnpe-chroniques-2026-07-26-recette-x1",
  # "hubeau-naiades-analyse-pc-2026-07-26-recette-x1"), jamais un secret — motif
  # volontairement étroit : seul le préfixe "hubeau-" est couvert, comme dans
  # l'entrée précédente.
  '''"release_key":\s*"hubeau-[A-Za-z0-9._-]*"''',
  # Mot de passe du service PostgreSQL ÉPHÉMÈRE des workflows de répétition
  # Water (.github/workflows/water-x3-staging-rehearsal.yml,
  # water-x4b-candidate-builder.yml). Ce n'est pas un secret et ne peut pas en
  # devenir un : la base est un service Docker du job, jointe uniquement depuis
  # le réseau du runner, détruite avec lui. Aucun secret de dépôt n'est
  # référencé, et `staging_environment.py` refuse tout repli sur une variable
  # Carbon&Co (`DATABASE_URL*`, `DATABASE_ADMIN_URL`).
  #
  # Pourquoi l'entrée apparaît maintenant et pas en X3 : `water_x3_ephemeral`
  # passe sous le seuil d'entropie de 3.5, `water_x4b_ephemeral` le dépasse de
  # 0,011 (3.511086). Le motif est donc couvert explicitement plutôt que laissé
  # dépendre d'un hasard d'entropie — un garde-fou qui ne se déclenche que par
  # chance ne protège rien. Motif volontairement étroit : seules les valeurs de
  # la forme `water_x<phase>_ephemeral` sont couvertes.
  '''water_x[0-9a-z]+_ephemeral''',
]
paths = [
  # Scénarios de démonstration produit : données entièrement fictives, jamais de
  # credential réel (voir docs/carbonco/demo/ASTERION_SCENARIO.md).
  '''apps/api/demo/scenarios/.*\.json''',
]
