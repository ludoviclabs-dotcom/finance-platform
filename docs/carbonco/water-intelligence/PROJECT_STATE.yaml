sources:
  COPERNICUS_EDO:
    connector_status: source_verified_decoder_deferred
    note: "Identite de source VERIFIEE (CDI v4.1, decade, EPSG:4326, classes 0-6, licence CEMS). Decodage raster VOLONTAIREMENT REPORTE pour le MVP : aucune dependance GDAL/rasterio/netCDF4/xarray, aucun endpoint WMS/WCS devine, aucune couche simulee, aucune valeur publiee. Ni un echec de source, ni une source vivante — decision MVP explicite, formalisee par la constante connectors/copernicus_edo.py::CONNECTOR_STATUS. Exclu du snapshot public P10 tant qu une ADR dediee n a pas tranche. Voir handoffs/P09_COPERNICUS_EDO.md section 6 et handoffs/WAVE_A_EU_CONNECTORS.md section 6."
open_decisions:
  - "WRI Aqueduct : licence CC BY 4.0 verifiee, mais WRI demande en outre un enregistrement pour partager/adapter les donnees. Enregistrement NON effectue. Aucune valeur Aqueduct ne peut etre publiee publiquement tant qu un humain n a pas tranche (cf. handoffs/P05_WRI_AQUEDUCT.md section 1.3). N a pas bloque Wave A."
  - "Copernicus EDO (statut formel source_verified_decoder_deferred, cf. bloc sources ci-dessus) : trois voies ouvertes pour debloquer le decodage — ADR + dependance raster (GDAL/rasterio ou netCDF4/h5py/xarray) avec justification/licence/impact ; verification d un service WMS/WCS officiel (endpoint, couche, parametres, format) puis artefacts operateur enregistres ; ou renoncement documente au CDI pour le produit public. Arbitrage humain requis, aucune echeance forcee."
