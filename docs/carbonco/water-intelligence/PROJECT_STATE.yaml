  COPERNICUS_EDO:
    connector_status: source_verified_decoder_deferred
    note: "Identite de source VERIFIEE (CDI v4.1, decade, EPSG:4326, classes 0-6, licence CEMS). Decodage raster VOLONTAIREMENT REPORTE pour le MVP : aucune dependance GDAL/rasterio/netCDF4/xarray, aucun endpoint WMS/WCS devine, aucune couche simulee, aucune valeur publiee. Ni un echec de source, ni une source vivante — decision MVP explicite, formalisee par la constante connectors/copernicus_edo.py::CONNECTOR_STATUS. Exclu du snapshot public P10 tant qu une ADR dediee n a pas tranche. Statut INCHANGE par la Wave B. Voir handoffs/P09_COPERNICUS_EDO.md section 6 et handoffs/WAVE_A_EU_CONNECTORS.md section 6."
  WRI_AQUEDUCT:
    connector_status: source_verified_publication_blocked
    note: "Licence CC BY 4.0 verifiee, mais WRI exige en outre un enregistrement pour partager/adapter les donnees. Enregistrement NON effectue. Aucune valeur Aqueduct publiable tant qu un humain n a pas tranche. Statut INCHANGE par la Wave B."
delivered_contracts:
  period_resolver:
    status: delivered
    delivered_by: WAVE_A
    note: "PeriodResolver injectable (Callable[[ObservationDraft], tuple[date, date]]) sur derive_observations()/run_pipeline(). Resolveur par defaut retrocompatible (period_start == period_end == observed_at.date()). period_start <= period_end verifie de facon generique dans derive_observations(), independamment du resolveur branche. Une erreur ATTENDUE de resolveur leve PipelineDataUnavailableError, capturee et nommee dans le rapport. TOUTE chronique (Hub Eau incluse) doit desormais l utiliser plutot que d encoder la periode dans le metric_code."
  water_observation_identity:
    status: delivered
    delivered_by: WAVE_C
    note: "WaterObservationIdentity + WaterObservationLedger (services/water_intelligence/observation_identity.py) : identite versionnee incluant la periode, la geographie et le scenario. Methode/version EXCLUES de l identite (decision documentee : une release est immuable, un recalcul de methode y est une incoherence a signaler, pas un fait nouveau). Detection de collision explicite, jamais de premiere valeur gagnante. ObservationDraft.dedup_key() (contrat PR-04 partage avec /materials) N EST PAS modifiee : tout graveur Evidence Kernel doit utiliser cette identite-ci pour une chronique."
  public_snapshot:
    status: delivered
    delivered_by: WAVE_C
    note: "WaterPublicSnapshot + assemble_public_snapshot + PublicSnapshotLoader. Snapshot VIDE valide et informatif (porte exclusions, decisions, budgets) car aucune source n a de decision humaine active. ETag sur le hash du snapshot. Double barriere licence. Garde-fou anti-tenant sur model_dump, __dict__ et model_extra."
  eea_metric_code:
    status: stable
    note: "Le trimestre EEA n est PLUS stocke dans metric_code : metric_code(scale, facet) est stable et independant de la saison ; la periode vit exclusivement dans period_start/period_end via eea_wei_plus.build_period_resolver(). Le contournement par metric_code est CADUC et ne doit pas etre repris."
open_decisions:
  - "WRI Aqueduct : enregistrement WRI non effectue, publication publique bloquee tant qu un humain n a pas tranche (cf. handoffs/P05_WRI_AQUEDUCT.md section 1.3). N a bloque ni la Wave A ni la Wave B."
  - "Copernicus EDO (statut formel source_verified_decoder_deferred, cf. bloc sources ci-dessus) : trois voies ouvertes pour debloquer le decodage — ADR + dependance raster (GDAL/rasterio ou netCDF4/h5py/xarray) avec justification/licence/impact ; verification d un service WMS/WCS officiel (endpoint, couche, parametres, format) puis artefacts operateur enregistres ; ou renoncement documente au CDI pour le produit public. Arbitrage humain requis, aucune echeance forcee."
  - "Identite persistee d une serie temporelle : ObservationDraft.dedup_key() (services/intelligence/adapters/base.py, contrat PR-04 partage avec l import /materials) ne porte PAS la periode. Elle ne doit jamais etre reutilisee telle quelle comme cle d identite persistee d une chronique — toute identite future doit inclure explicitement la periode ou etre protegee par une verification de collision. A trancher par le futur graveur Evidence Kernel P10. Voir RISK_REGISTER.md."
