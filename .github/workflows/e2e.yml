name: E2E Tests

on:
  # Manuel uniquement (Actions > E2E Tests > Run workflow). Le déclenchement
  # `push` sur master a été retiré : à chaque run de novembre 2026 l'étape
  # « Run E2E tests » tournait jusqu'au timeout du job (20 min facturées pour
  # rien). Cause : `e2e/tests` est une suite d'intégration qui appelle un vrai
  # backend, or le secret E2E_API_URL n'existe pas et le front construit en CI
  # pointait sur http://localhost:8000 (rien n'y écoute). Chaque test attendait
  # donc son timeout puis était rejoué. Le pré-contrôle ci-dessous échoue
  # maintenant en quelques secondes si le backend n'est pas configuré.
  # À rétablir sur `push` seulement une fois la suite verte en manuel.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Image épinglée : `ubuntu-latest` pointe désormais sur ubuntu 26.04, que
    # Playwright 1.59 ne prend pas en charge (`playwright install --with-deps`
    # échoue : « does not support chromium on ubuntu26.04-x64 »). À repasser
    # sur `ubuntu-latest` après une montée de Playwright qui supporte 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/carbon

    env:
      E2E_BASE_URL: http://localhost:3003
      # Staging / Preview uniquement : ces tests créent des données (upload,
      # revue, export). Ne jamais pointer ce secret sur la production.
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
      # Le front lit NEXT_PUBLIC_API_BASE_URL (lib/api.ts), inlinée au BUILD ;
      # E2E_API_URL n'est lue par aucun code applicatif.
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.E2E_API_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
      # Variables Upstash — fail-open si absentes (rate limit désactivé en CI)
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Échoue en quelques secondes, AVANT l'installation de Playwright (~4 min)
      # et le build, si les prérequis des E2E manquent ou si le backend ne répond
      # pas. Les valeurs des secrets ne sont jamais affichées.
      - name: Pré-contrôle des prérequis (backend + compte de test)
        run: |
          missing=0
          for v in E2E_API_URL E2E_USER_EMAIL E2E_USER_PASSWORD AUTH_JWT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error title=Prérequis E2E manquant::Le secret ${v} est absent ou vide."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 3             "${E2E_API_URL%/}/health" > /dev/null             || { echo "::error title=Backend E2E injoignable::GET /health a échoué sur le backend de E2E_API_URL."; exit 1; }
          echo "Backend joignable, prérequis OK."

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/carbon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js
        run: npm run build
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}

      - name: Start Next.js server
        run: npm run start -- --port 3003 &
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}

      - name: Wait for server
        run: npx wait-on http://localhost:3003 --timeout 30000

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/carbon/playwright-report/
          retention-days: 7
