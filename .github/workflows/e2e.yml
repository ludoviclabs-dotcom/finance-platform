name: E2E Tests

on:
  # Manuel uniquement (Actions > E2E Tests > Run workflow). Le déclenchement
  # `push` sur master a été retiré : à chaque run de novembre 2026 l'étape
  # « Run E2E tests » restait bloquée jusqu'au timeout du job (20 min facturées
  # pour rien). À rétablir une fois les E2E authentifiés stabilisés.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Image épinglée : `ubuntu-latest` pointe désormais sur ubuntu 26.04, que
    # Playwright 1.59 ne prend pas en charge (`playwright install --with-deps`
    # échoue : « does not support chromium on ubuntu26.04-x64 »). À repasser
    # sur `ubuntu-latest` après une montée de Playwright qui supporte 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/carbon

    env:
      E2E_BASE_URL: http://localhost:3003
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
      # Variables Upstash — fail-open si absentes (rate limit désactivé en CI)
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/carbon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js
        run: npm run build
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}

      - name: Start Next.js server
        run: npm run start -- --port 3003 &
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}

      - name: Wait for server
        run: npx wait-on http://localhost:3003 --timeout 30000

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/carbon/playwright-report/
          retention-days: 7
