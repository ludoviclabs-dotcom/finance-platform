  - "WRI Aqueduct : licence CC BY 4.0 verifiee, mais WRI demande en outre un enregistrement pour partager/adapter les donnees. Enregistrement NON effectue. Aucune valeur Aqueduct ne peut etre publiee publiquement tant qu un humain n a pas tranche (cf. handoffs/P05_WRI_AQUEDUCT.md section 1.3). N a pas bloque Wave A."
  - "Copernicus EDO : le portail officiel ne distribue que GeoTIFF et NetCDF, aucun export tabulaire. Decoder la grille exigerait GDAL/rasterio ou netCDF4, dependances lourdes sans ADR ; aucun parametrage WMS/WCS n a pu etre verifie. Wave A livre le gate, la configuration, le contrat et les tests, et refuse explicitement de produire une valeur. Trois voies ouvertes (ADR + dependance raster, verification WMS/WCS, ou renoncement documente) — arbitrage humain requis. COPERNICUS_EDO doit rester exclu du snapshot public P10 tant que la decision n est pas rendue (cf. handoffs/P09_COPERNICUS_EDO.md section 6)."
  - "Periode aplatie par P03 : derive_observations fixe period_start == period_end et ne recopie pas les metadonnees du draft. Wave A encode donc le trimestre dans le metric_code. A arbitrer en P10 : propager period_start/period_end et les metadonnees dans derive, ou officialiser la convention metric_code (cf. handoffs/WAVE_A_EU_CONNECTORS.md section 5.1)."
